[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.4",
    "langchain-openai>=1.0.0",
    "langgraph>=0.6",
    "simpy>=4.1.2",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
